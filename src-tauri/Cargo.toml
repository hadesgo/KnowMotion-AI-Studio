[package]
name = "knowmotion-ai-studio"
version = "0.1.0"
description = "AI-powered knowledge animation studio"
authors = ["KnowMotion"]
edition = "2021"

[lib]
name = "knowmotion_ai_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
chrono = "0.4.45"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
