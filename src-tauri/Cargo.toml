[package]
name = "knowmotion-ai-studio"
version = "0.1.0"
description = "AI-powered knowledge animation studio"
authors = ["KnowMotion"]
edition = "2021"

[lib]
name = "knowmotion_ai_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = "0.4.45"
hex = "0.4.3"
keyring = "4.2.0"
hound = "3.5.1"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tauri = { version = "2.12.5", features = [] }
tokio = { version = "1.54.1", features = ["sync", "time"] }
uuid = { version = "1.29.2", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.27.0"
